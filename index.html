<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競技ルール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f1ea;--ink:#1b1b19;--sub:#6b6860;--accent:#c4471d;--card:#ebe6db}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;
    line-height:1.8;-webkit-font-smoothing:antialiased;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:40px 16px}
  .sports{width:100%;max-width:880px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .sport{background:var(--card);padding:40px 32px 32px;display:flex;flex-direction:column}
  .mark{width:52px;height:52px;margin-bottom:24px}
  .en{font-family:"Inter",sans-serif;font-size:12px;letter-spacing:.2em;color:var(--sub)}
  h2{font-size:34px;font-weight:700;margin-top:2px}
  .btn{margin-top:28px;align-self:flex-start;font:inherit;font-size:14px;font-weight:500;
    background:var(--ink);color:var(--bg);border:none;cursor:pointer;padding:13px 26px;
    display:inline-flex;align-items:center;gap:12px;transition:background .2s}
  .btn:hover{background:var(--accent)}
  .btn svg{width:14px;height:14px}

  .viewer{position:fixed;inset:0;background:rgba(27,27,25,.92);display:none;flex-direction:column;z-index:10}
  .viewer.open{display:flex}
  .v-bar{display:flex;justify-content:space-between;align-items:center;padding:0 20px;height:56px;color:#f4f1ea;flex-shrink:0}
  .v-title{font-size:14px;font-weight:500}
  .v-close{background:none;border:1px solid rgba(244,241,234,.4);color:#f4f1ea;font:inherit;font-size:13px;padding:6px 16px;cursor:pointer}
  .v-close:hover{background:#f4f1ea;color:var(--ink)}
  .v-body{flex:1;overflow-y:auto;padding:4px 12px 40px;-webkit-overflow-scrolling:touch}
  .v-pages{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .v-pages canvas{width:100%;height:auto;display:block;background:#fff;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .v-msg{color:#f4f1ea;text-align:center;padding:80px 0;font-size:14px;opacity:.8}

  @media (max-width:640px){.sports{grid-template-columns:1fr}.sport{padding:32px 24px 28px}}
</style>
</head>
<body>

<main class="sports">
  <article class="sport">
    <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="20" cy="34" r="12" fill="#c4471d"/>
      <circle cx="38" cy="30" r="12" fill="#1b1b19"/>
      <circle cx="30" cy="14" r="4" fill="#1b1b19"/>
    </svg>
    <span class="en">BOCCIA</span>
    <h2>ボッチャ</h2>
    <button class="btn" type="button" data-pdf="boccia.pdf" data-title="ボッチャ ルール">
      ルールを見る
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 7h12M8 2l5 5-5 5"/></svg>
    </button>
  </article>

  <article class="sport">
    <svg class="mark" viewBox="0 0 56 56" aria-hidden="true">
      <rect x="10" y="20" width="8" height="26" fill="#1b1b19"/>
      <rect x="24" y="12" width="8" height="34" fill="#c4471d"/>
      <rect x="38" y="20" width="8" height="26" fill="#1b1b19"/>
    </svg>
    <span class="en">MÖLKKY</span>
    <h2>モルック</h2>
    <button class="btn" type="button" data-pdf="molkky.pdf" data-title="モルック ルール">
      ルールを見る
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 7h12M8 2l5 5-5 5"/></svg>
    </button>
  </article>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle">
  <div class="v-bar">
    <span class="v-title" id="vTitle"></span>
    <button class="v-close" id="vClose" type="button">閉じる</button>
  </div>
  <div class="v-body"><div class="v-pages" id="vPages"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(() => {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const ALLOWED = ['boccia.pdf', 'molkky.pdf'];
  const viewer = document.getElementById('viewer');
  const pages  = document.getElementById('vPages');
  const title  = document.getElementById('vTitle');
  let task = null, lastBtn = null;

  function msg(text){
    pages.replaceChildren();
    const d = document.createElement('div');
    d.className = 'v-msg'; d.textContent = text;
    pages.appendChild(d);
  }

  async function open(src, name, btn){
    if (!ALLOWED.includes(src)) return;
    lastBtn = btn;
    title.textContent = name;
    msg('読み込み中');
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('vClose').focus();
    try{
      task = pdfjsLib.getDocument({ url: src });
      const pdf = await task.promise;
      pages.replaceChildren();
      const width = Math.min(pages.clientWidth || 860, 860);
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      for (let i = 1; i <= pdf.numPages; i++){
        if (!viewer.classList.contains('open')) return;
        const page = await pdf.getPage(i);
        const vp = page.getViewport({ scale: (width / page.getViewport({scale:1}).width) * dpr });
        const c = document.createElement('canvas');
        c.width = vp.width; c.height = vp.height;
        pages.appendChild(c);
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
    }catch(e){ msg('資料を読み込めませんでした'); }
  }

  function close(){
    if (task) { task.destroy(); task = null; }
    viewer.classList.remove('open');
    pages.replaceChildren();
    document.body.style.overflow = '';
    if (lastBtn) lastBtn.focus();
  }

  document.querySelectorAll('[data-pdf]').forEach(b =>
    b.addEventListener('click', () => open(b.dataset.pdf, b.dataset.title, b)));
  document.getElementById('vClose').addEventListener('click', close);
  document.addEventListener('keydown', e => {
    if (!viewer.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if ((e.ctrlKey || e.metaKey) && ['s','p'].includes(e.key.toLowerCase())) e.preventDefault();
  });
  viewer.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
